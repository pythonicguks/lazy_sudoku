[project]
name = "lazy-sudoku"
version = "0.1.0"
description = "A small Sudoku grid model and PyQt5 viewer"
requires-python = ">=3.12"
dependencies = [
    "pyqt5>=5.15",
]

[project.scripts]
lazy-sudoku = "lazy_sudoku.controller:lazy_sudoku"

[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "lazy_sudoku",
]

[tool.uv.sources.harness-mcp]
git = "https://github.com/pythonicguks/gvdm_multitools"
branch = "claude/feed-repository-files-cewjnw"
subdirectory = "harness-mcp"

[tool.harness]
schema_version = "1"
conflict_policy = "warn"

[[tool.harness.instances]]
id = "harness-mcp"
version = "0.1.0"
tools = [
    "harness.lint_check",
    "harness.format_check",
    "harness.type_check",
    "harness.test_run",
    "harness.dep_sync",
    "harness.dep_add",
    "harness.repo_status",
    "harness.repo_diff",
    "harness.ensure_gitignore",
    "harness.capitalize_session",
]
owns_paths = [
    "docs/adr",
    "docs/harness-notes.md",
    "CHANGELOG-proposals.md",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "harness-mcp",
]
