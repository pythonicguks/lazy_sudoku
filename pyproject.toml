[project]
name = "lazy-sudoku"
version = "0.1.0"
description = "A small Sudoku grid model and PyQt5 viewer"
requires-python = ">=3.11"
dependencies = [
    "pyqt5>=5.15",
]

[project.scripts]
lazy-sudoku = "lazy_sudoku.controller:lazy_sudoku"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lazy_sudoku"]
